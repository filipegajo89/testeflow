<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - FlowBnb</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/img/favicon.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@11.0.0"></script>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 text-center">
                <img src="assets/img/logo.png" alt="FlowBnb Logo" class="logo mb-4">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title mb-4">Redefinir Senha</h2>
                        <p class="card-text">Digite sua nova senha abaixo.</p>
                        
                        <form id="resetPasswordForm">
                            <div class="mb-3">
                                <input type="password" class="form-control" id="newPassword" placeholder="Nova senha" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirmar nova senha" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Redefinir Senha</button>
                        </form>
                        
                        <div id="resetResult" class="alert mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/appwrite-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Adiciona evento de submit ao formulário de reset de senha
            const resetForm = document.getElementById('resetPasswordForm');
            if (resetForm) {
                resetForm.addEventListener('submit', handleResetPassword);
            }
        });
        
        async function handleResetPassword(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resultElement = document.getElementById('resetResult');
            
            resultElement.classList.remove('d-none', 'alert-success', 'alert-danger');
            
            // Verifica se as senhas coincidem
            if (newPassword !== confirmPassword) {
                resultElement.classList.add('alert-danger');
                resultElement.textContent = 'As senhas não coincidem. Por favor, tente novamente.';
                resultElement.classList.remove('d-none');
                return;
            }
            
            try {
                // Obtém os parâmetros da URL
                const urlParams = new URLSearchParams(window.location.search);
                const userId = urlParams.get('userId');
                const secret = urlParams.get('secret');
                
                if (!userId || !secret) {
                    throw new Error('Link de recuperação inválido.');
                }
                
                // Completa a recuperação de senha
                await account.updateRecovery(userId, secret, newPassword, newPassword);
                
                // Exibe mensagem de sucesso
                resultElement.classList.add('alert-success');
                resultElement.innerHTML = 'Senha redefinida com sucesso! <a href="index.html">Clique aqui</a> para fazer login.';
                resultElement.classList.remove('d-none');
                
                // Limpa o formulário
                resetForm.reset();
            } catch (error) {
                console.error('Erro ao redefinir senha:', error);
                
                // Exibe mensagem de erro
                resultElement.classList.add('alert-danger');
                resultElement.textContent = 'Erro ao redefinir senha: ' + error.message;
                resultElement.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
